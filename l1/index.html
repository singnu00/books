<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 반 책장 | 독서왕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Gowun+Batang&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2620;
    --ink-soft:#5c5347;
    --paper:#faf6ee;
    --paper-card:#fffdf8;
    --forest:#3f6247;
    --forest-deep:#2c4732;
    --gold:#c08a34;
    --line:#e4dcc9;
    --danger:#a3452f;
    --radius:2px;
    --serif: 'Noto Serif KR', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Pretendard', sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

  /* ---------- HERO ---------- */
  .hero{
    background:var(--forest);
    color:var(--paper);
    position:relative;
    padding:28px 24px 0;
    overflow:hidden;
  }
  .hero-top{
    max-width:1000px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
  }
  .brand{max-width:640px;}
  .brand h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(1.7rem,4vw + 0.6rem,2.6rem);
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  .brand p{
    margin:0;
    color:#d9e6dd;
    font-size:0.98rem;
    max-width:44ch;
  }
  #adminToggleBtn{
    flex-shrink:0;
    background:transparent;
    border:1px solid rgba(250,246,238,0.45);
    color:var(--paper);
    padding:9px 16px;
    border-radius:999px;
    font-size:0.85rem;
    display:flex;
    align-items:center;
    gap:6px;
    transition:background .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  #adminToggleBtn:hover{background:rgba(250,246,238,0.12);border-color:rgba(250,246,238,0.8);}

  .shelf{
    max-width:1000px;
    margin:26px auto 0;
    display:flex;
    align-items:flex-end;
    gap:6px;
    padding:0 4px 0;
    overflow:hidden;
  }
  .spine{
    flex:1 1 auto;
    border-radius:3px 3px 0 0;
    min-width:10px;
    opacity:0.9;
  }
  .shelf-board{
    max-width:1000px;
    margin:0 auto;
    height:10px;
    background:var(--gold);
    box-shadow:0 3px 0 rgba(0,0,0,0.12);
  }
  .hero-space{height:22px;}

  /* ---------- FILTER BAR ---------- */
  .filter-wrap{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .filter-bar{
    max-width:1000px;
    margin:0 auto;
    display:flex;
    gap:22px;
    padding:14px 24px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .filter-bar::-webkit-scrollbar{display:none;}
  .filter-tab{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:0.95rem;
    padding:4px 2px 8px;
    border-bottom:2px solid transparent;
    white-space:nowrap;
    flex-shrink:0;
  }
  .filter-tab.active{
    color:var(--forest-deep);
    border-bottom-color:var(--forest);
    font-weight:600;
  }

  /* ---------- MAIN / GRID ---------- */
  main{max-width:1000px;margin:0 auto;padding:28px 24px 100px;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:22px;
  }
  .empty{
    text-align:center;
    padding:70px 20px;
    color:var(--ink-soft);
  }
  .empty .big{font-size:2.4rem;margin-bottom:10px;}

  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    display:flex;
    gap:14px;
    position:relative;
    text-align:left;
    width:100%;
    transition:border-color .15s ease, transform .15s ease;
  }
  .card:hover{border-color:var(--gold);}
  .card-btn{border:none;background:none;padding:0;}

  .cover{
    width:78px;
    aspect-ratio:2/3;
    flex-shrink:0;
    border-radius:1px;
    object-fit:cover;
    box-shadow:2px 2px 0 rgba(43,38,32,0.08);
  }
  .cover-placeholder{
    width:78px;
    aspect-ratio:2/3;
    flex-shrink:0;
    border-radius:1px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-family:var(--serif);
    font-size:0.72rem;
    text-align:center;
    padding:6px 4px;
    line-height:1.3;
    box-shadow:2px 2px 0 rgba(43,38,32,0.08);
  }
  .cover-placeholder .ic{font-size:1.3rem;margin-bottom:4px;}

  .card-body{flex:1;min-width:0;}
  .stamp{
    display:inline-block;
    font-size:0.68rem;
    padding:2px 9px;
    border:1px solid currentColor;
    border-radius:999px;
    transform:rotate(-3deg);
    margin-bottom:8px;
  }
  .card h3{
    font-family:var(--serif);
    font-size:1.08rem;
    margin:0 0 3px;
    color:var(--ink);
  }
  .card .author{
    font-size:0.82rem;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .card .summary{
    font-size:0.88rem;
    color:var(--ink);
    margin:0;
    font-style:italic;
    border-left:2px solid var(--line);
    padding-left:9px;
  }

  .admin-actions{
    position:absolute;
    top:12px;
    right:12px;
    display:flex;
    gap:6px;
  }
  .icon-btn{
    background:var(--paper);
    border:1px solid var(--line);
    width:28px;
    height:28px;
    border-radius:50%;
    font-size:0.8rem;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon-btn:hover{border-color:var(--forest);}

  /* ---------- ADMIN BAR / FAB ---------- */
  .admin-bar{
    position:sticky;
    top:0;
    z-index:25;
    background:var(--forest-deep);
    color:#fff;
    font-size:0.85rem;
  }
  .admin-bar-inner{
    max-width:1000px;
    margin:0 auto;
    padding:9px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .admin-bar button{
    background:transparent;
    border:1px solid rgba(255,255,255,0.4);
    color:#fff;
    padding:5px 12px;
    border-radius:999px;
    font-size:0.78rem;
  }
  .admin-bar button:hover{background:rgba(255,255,255,0.14);}
  .admin-bar-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .fab{
    position:fixed;
    right:22px;
    bottom:24px;
    background:var(--forest);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:14px 20px;
    font-size:0.92rem;
    display:flex;
    align-items:center;
    gap:8px;
    box-shadow:0 6px 16px rgba(43,38,32,0.28);
    z-index:30;
  }
  .fab:hover{background:var(--forest-deep);}

  /* ---------- MODALS ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(43,38,32,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .hidden{display:none !important;}
  .modal{
    background:var(--paper-card);
    max-width:520px;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    border-radius:2px;
    padding:26px 24px;
    position:relative;
    border:1px solid var(--line);
  }
  .modal h2{
    font-family:var(--serif);
    margin:0 0 18px;
    font-size:1.35rem;
  }
  .modal-close{
    position:absolute;
    top:16px;
    right:16px;
    background:none;
    border:none;
    font-size:1.3rem;
    color:var(--ink-soft);
    line-height:1;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:0.82rem;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input[type=text],
  .field input[type=password],
  .field textarea,
  .field select{
    width:100%;
    border:1px solid var(--line);
    background:#fff;
    padding:10px 11px;
    font-family:inherit;
    font-size:0.94rem;
    border-radius:1px;
    color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:78px;}
  .field input[type=file]{font-size:0.85rem;}
  .cover-preview{
    width:70px;aspect-ratio:2/3;object-fit:cover;margin-top:8px;border-radius:1px;
  }
  .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}
  .btn{
    padding:10px 18px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    font-size:0.88rem;
  }
  .btn-primary{background:var(--forest);border-color:var(--forest);color:#fff;}
  .btn-primary:hover{background:var(--forest-deep);}
  .btn-danger{background:#fff;border-color:var(--danger);color:var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .helper{font-size:0.78rem;color:var(--ink-soft);margin-top:8px;}

  /* detail modal */
  .detail-cover{width:120px;margin-bottom:14px;}
  .detail-stamp{margin-bottom:10px;}
  .detail-modal h2{font-size:1.5rem;}
  .detail-author{color:var(--ink-soft);margin:-6px 0 14px;font-size:0.9rem;}
  .detail-section{margin-bottom:16px;}
  .detail-section h4{
    font-size:0.78rem;
    text-transform:none;
    color:var(--ink-soft);
    margin:0 0 6px;
    font-weight:600;
  }
  .detail-section p{margin:0;white-space:pre-wrap;}
  .detail-summary{font-style:italic;border-left:2px solid var(--line);padding-left:10px;}

  footer{
    text-align:center;
    padding:20px;
    font-size:0.78rem;
    color:var(--ink-soft);
  }

  @media (max-width:480px){
    .hero{padding:22px 18px 0;}
    main{padding:22px 16px 100px;}
    .card{flex-direction:column;}
    .cover, .cover-placeholder{width:100%;aspect-ratio:3/2;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; scroll-behavior:auto !important;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-top">
    <div class="brand">
      <h1>우리 반 책장</h1>
      <p>책 읽는 걸 좋아하는 반 친구가 직접 고르고 소개하는 책들이에요. 마음에 드는 책이 있으면 한번 읽어보세요.</p>
    </div>
    <button id="adminToggleBtn">🔒 관리자</button>
  </div>
  <div class="hero-space"></div>
  <div class="shelf" id="shelf"></div>
  <div class="shelf-board"></div>
</div>

<div class="admin-bar hidden" id="adminBar">
  <div class="admin-bar-inner">
    <span>🔓 관리자 모드입니다</span>
    <div class="admin-bar-actions">
      <button id="exportBtn">백업 다운로드</button>
      <button id="importBtn">백업 불러오기</button>
      <button id="logoutBtn">로그아웃</button>
    </div>
  </div>
</div>
<input type="file" id="importFile" accept="application/json" class="hidden">

<div class="filter-wrap">
  <div class="filter-bar" id="filterBar"></div>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty hidden" id="emptyState">
    <div class="big">📖</div>
    <p>아직 등록된 책이 없어요.<br>관리자 모드에서 첫 번째 책을 소개해보세요!</p>
  </div>
</main>

<button class="fab hidden" id="addBtn">＋ 책 추가</button>

<footer>독서왕 · 우리 반 책장</footer>

<!-- 비밀번호 설정 (최초 1회) -->
<div class="overlay hidden" id="setPwOverlay">
  <div class="modal">
    <button class="modal-close" data-close="setPwOverlay">×</button>
    <h2>관리자 비밀번호 설정</h2>
    <p class="helper" style="margin-top:-8px;margin-bottom:16px;">처음 사용하는 것 같아요. 관리자 모드에 사용할 비밀번호를 정해주세요.</p>
    <form id="setPwForm">
      <div class="field">
        <label for="pw1">비밀번호</label>
        <input type="password" id="pw1" required minlength="2">
      </div>
      <div class="field">
        <label for="pw2">비밀번호 확인</label>
        <input type="password" id="pw2" required minlength="2">
      </div>
      <p class="helper" id="setPwError" style="color:var(--danger);display:none;">비밀번호가 서로 달라요. 다시 입력해주세요.</p>
      <div class="form-actions">
        <button type="button" class="btn" data-close="setPwOverlay">취소</button>
        <button type="submit" class="btn btn-primary">설정하고 시작하기</button>
      </div>
    </form>
  </div>
</div>

<!-- 로그인 -->
<div class="overlay hidden" id="loginOverlay">
  <div class="modal">
    <button class="modal-close" data-close="loginOverlay">×</button>
    <h2>관리자 로그인</h2>
    <form id="loginForm">
      <div class="field">
        <label for="loginPw">비밀번호</label>
        <input type="password" id="loginPw" required>
      </div>
      <p class="helper" id="loginError" style="color:var(--danger);display:none;">비밀번호가 틀렸어요.</p>
      <div class="form-actions">
        <button type="button" class="btn" data-close="loginOverlay">취소</button>
        <button type="submit" class="btn btn-primary">로그인</button>
      </div>
    </form>
  </div>
</div>

<!-- 책 추가/수정 -->
<div class="overlay hidden" id="bookOverlay">
  <div class="modal">
    <button class="modal-close" data-close="bookOverlay">×</button>
    <h2 id="bookFormTitle">책 추가하기</h2>
    <form id="bookForm">
      <input type="hidden" id="bookId">
      <div class="field">
        <label for="bCategory">카테고리</label>
        <input type="text" id="bCategory" list="categoryList" placeholder="예: 소설, 에세이, 과학..." required>
        <datalist id="categoryList">
          <option value="소설"><option value="시·에세이"><option value="과학">
          <option value="역사"><option value="인문·철학"><option value="자기계발">
          <option value="만화"><option value="기타">
        </datalist>
      </div>
      <div class="field">
        <label for="bCover">책 표지 사진 (선택)</label>
        <input type="file" id="bCover" accept="image/*">
        <img id="coverPreview" class="cover-preview hidden">
      </div>
      <div class="field">
        <label for="bTitle">책 제목</label>
        <input type="text" id="bTitle" required>
      </div>
      <div class="field">
        <label for="bAuthor">지은이</label>
        <input type="text" id="bAuthor" required>
      </div>
      <div class="field">
        <label for="bSummary">한 줄 요약</label>
        <input type="text" id="bSummary" maxlength="70" required>
      </div>
      <div class="field">
        <label for="bReason">소개하고 싶은 이유</label>
        <textarea id="bReason" required></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn" data-close="bookOverlay">취소</button>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- 책 상세 -->
<div class="overlay hidden" id="detailOverlay">
  <div class="modal detail-modal" id="detailContent">
  </div>
</div>

<script>
/*
  저장 방식 안내:
  - 이 파일은 브라우저의 localStorage에 책 목록과 관리자 비밀번호를 저장합니다.
  - Claude.ai 채팅 안의 미리보기 화면(샌드박스)에서는 보안 정책상 localStorage가 막혀 있어
    새로고침하면 데이터가 초기화될 수 있어요.
  - 이 파일을 다운로드해서 그대로 열거나(더블클릭) 학교 홈페이지·깃허브 페이지 등에
    올려서 사용하면 정상적으로 저장됩니다.
  - 관리자 모드의 "백업 다운로드/불러오기" 기능으로 책 목록을 JSON 파일로 내보내고
    다시 불러올 수 있으니, 컴퓨터를 옮기거나 파일을 다시 배포할 때 활용하세요.
*/

const LS_BOOKS = 'rk_books';
const LS_PW = 'rk_admin_pw';

const PALETTE = ['#8B3A3A','#2F6F62','#35507A','#8A6A2F','#5B4B8A','#6B7A3A','#B5602C','#6B6558','#9C4B70'];

const SEED_BOOKS = [
  {
    id:'seed1', category:'소설', cover:'',
    title:'아몬드', author:'손원평',
    summary:'감정을 잘 느끼지 못하는 소년이 세상과 부딪히며 성장하는 이야기',
    reason:'친구 관계와 공감에 대해 다시 생각하게 해준 책이에요. 특히 후반부 전개가 마음을 오래 울렸어요.'
  },
  {
    id:'seed2', category:'에세이', cover:'',
    title:'죽고 싶지만 떡볶이는 먹고 싶어', author:'백세희',
    summary:'우울과 함께 살아가는 하루하루를 담담하게 기록한 에세이',
    reason:'무겁게 느껴질 수 있는 이야기를 편안하게 풀어내서 부담 없이 읽을 수 있었어요.'
  },
  {
    id:'seed3', category:'과학', cover:'',
    title:'코스모스', author:'칼 세이건',
    summary:'우주와 인간의 자리에 대한 깊은 성찰을 담은 교양 과학서',
    reason:'밤하늘을 볼 때마다 이 책이 생각나요. 과학이 이렇게 아름다울 수 있다는 걸 처음 느꼈어요.'
  }
];

let books = loadBooks();
let isAdmin = false;
let activeCategory = '전체';
let editingId = null;

function loadBooks(){
  try{
    const raw = localStorage.getItem(LS_BOOKS);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return SEED_BOOKS.slice();
}
function saveBooks(){
  try{ localStorage.setItem(LS_BOOKS, JSON.stringify(books)); }catch(e){}
}
function colorForCategory(cat){
  let h = 0;
  for(let i=0;i<cat.length;i++){ h = cat.charCodeAt(i) + ((h<<5)-h); }
  return PALETTE[Math.abs(h) % PALETTE.length];
}

/* ---------- 책장 장식 ---------- */
function renderShelf(){
  const shelf = document.getElementById('shelf');
  shelf.innerHTML = '';
  const cats = books.length ? books.map(b=>b.category) : ['소설','에세이','과학','역사','인문'];
  const heights = [46,58,40,64,50,36,60,44];
  cats.concat(cats).slice(0,16).forEach((cat,i)=>{
    const s = document.createElement('div');
    s.className = 'spine';
    s.style.background = colorForCategory(cat);
    s.style.height = heights[i % heights.length] + 'px';
    shelf.appendChild(s);
  });
}

/* ---------- 필터 ---------- */
function getCategories(){
  const set = new Set(books.map(b=>b.category));
  return ['전체', ...Array.from(set)];
}
function renderFilters(){
  const bar = document.getElementById('filterBar');
  bar.innerHTML = '';
  getCategories().forEach(cat=>{
    const btn = document.createElement('button');
    btn.className = 'filter-tab' + (cat === activeCategory ? ' active' : '');
    btn.textContent = cat;
    btn.addEventListener('click', ()=>{ activeCategory = cat; render(); });
    bar.appendChild(btn);
  });
}

/* ---------- 카드 렌더링 ---------- */
function coverEl(book){
  if(book.cover){
    const img = document.createElement('img');
    img.className = 'cover';
    img.src = book.cover;
    img.alt = book.title + ' 표지';
    return img;
  }
  const div = document.createElement('div');
  div.className = 'cover-placeholder';
  div.style.background = colorForCategory(book.category);
  div.innerHTML = '<span class="ic">📖</span>' + escapeHtml(book.title);
  return div;
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  grid.innerHTML = '';
  const filtered = books.filter(b => activeCategory === '전체' || b.category === activeCategory);

  if(books.length === 0){
    empty.classList.remove('hidden');
    grid.classList.add('hidden');
    return;
  }
  empty.classList.add('hidden');
  grid.classList.remove('hidden');

  filtered.forEach(book=>{
    const card = document.createElement('div');
    card.className = 'card';

    const openBtn = document.createElement('button');
    openBtn.className = 'card-btn';
    openBtn.style.display = 'flex';
    openBtn.style.gap = '14px';
    openBtn.style.textAlign = 'left';
    openBtn.style.flex = '1';
    openBtn.addEventListener('click', ()=> openDetail(book.id));

    openBtn.appendChild(coverEl(book));

    const body = document.createElement('div');
    body.className = 'card-body';
    const color = colorForCategory(book.category);
    body.innerHTML = `
      <span class="stamp" style="color:${color}">${escapeHtml(book.category)}</span>
      <h3>${escapeHtml(book.title)}</h3>
      <p class="author">${escapeHtml(book.author)}</p>
      <p class="summary">${escapeHtml(book.summary)}</p>
    `;
    openBtn.appendChild(body);
    card.appendChild(openBtn);

    if(isAdmin){
      const actions = document.createElement('div');
      actions.className = 'admin-actions';
      const editBtn = document.createElement('button');
      editBtn.className = 'icon-btn';
      editBtn.title = '수정';
      editBtn.textContent = '✎';
      editBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openBookForm(book.id); });
      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn';
      delBtn.title = '삭제';
      delBtn.textContent = '🗑';
      delBtn.addEventListener('click', (e)=>{ e.stopPropagation(); deleteBook(book.id); });
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      card.appendChild(actions);
    }

    grid.appendChild(card);
  });
}

function render(){
  renderShelf();
  renderFilters();
  renderGrid();
  document.getElementById('adminBar').classList.toggle('hidden', !isAdmin);
  document.getElementById('addBtn').classList.toggle('hidden', !isAdmin);
}

/* ---------- 상세 모달 ---------- */
function openDetail(id){
  const book = books.find(b=>b.id === id);
  if(!book) return;
  const content = document.getElementById('detailContent');
  const color = colorForCategory(book.category);
  content.innerHTML = `
    <button class="modal-close" data-close="detailOverlay">×</button>
    ${book.cover ? `<img src="${book.cover}" class="detail-cover" alt="${escapeHtml(book.title)} 표지">` : ''}
    <span class="stamp detail-stamp" style="color:${color}">${escapeHtml(book.category)}</span>
    <h2>${escapeHtml(book.title)}</h2>
    <p class="detail-author">${escapeHtml(book.author)} 지음</p>
    <div class="detail-section">
      <h4>한 줄 요약</h4>
      <p class="detail-summary">${escapeHtml(book.summary)}</p>
    </div>
    <div class="detail-section">
      <h4>소개하고 싶은 이유</h4>
      <p>${escapeHtml(book.reason)}</p>
    </div>
  `;
  showOverlay('detailOverlay');
}

/* ---------- 오버레이 공통 ---------- */
function showOverlay(id){ document.getElementById(id).classList.remove('hidden'); }
function hideOverlay(id){ document.getElementById(id).classList.add('hidden'); }

document.querySelectorAll('[data-close]').forEach(btn=>{
  btn.addEventListener('click', ()=> hideOverlay(btn.dataset.close));
});
document.querySelectorAll('.overlay').forEach(ov=>{
  ov.addEventListener('click', (e)=>{ if(e.target === ov) hideOverlay(ov.id); });
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    document.querySelectorAll('.overlay').forEach(ov=>{ if(!ov.classList.contains('hidden')) hideOverlay(ov.id); });
  }
});

/* ---------- 관리자 인증 ---------- */
document.getElementById('adminToggleBtn').addEventListener('click', ()=>{
  if(isAdmin){
    logoutAdmin();
    return;
  }
  const savedPw = localStorage.getItem(LS_PW);
  if(!savedPw){
    document.getElementById('pw1').value = '';
    document.getElementById('pw2').value = '';
    document.getElementById('setPwError').style.display = 'none';
    showOverlay('setPwOverlay');
  }else{
    document.getElementById('loginPw').value = '';
    document.getElementById('loginError').style.display = 'none';
    showOverlay('loginOverlay');
  }
});

document.getElementById('setPwForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const p1 = document.getElementById('pw1').value;
  const p2 = document.getElementById('pw2').value;
  if(p1 !== p2){
    document.getElementById('setPwError').style.display = 'block';
    return;
  }
  localStorage.setItem(LS_PW, p1);
  hideOverlay('setPwOverlay');
  loginAdmin();
});

document.getElementById('loginForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const pw = document.getElementById('loginPw').value;
  if(pw === localStorage.getItem(LS_PW)){
    hideOverlay('loginOverlay');
    loginAdmin();
  }else{
    document.getElementById('loginError').style.display = 'block';
  }
});

function loginAdmin(){
  isAdmin = true;
  document.getElementById('adminToggleBtn').textContent = '🔓 관리자 모드';
  render();
}
function logoutAdmin(){
  isAdmin = false;
  document.getElementById('adminToggleBtn').textContent = '🔒 관리자';
  render();
}
document.getElementById('logoutBtn').addEventListener('click', logoutAdmin);

/* ---------- 책 추가/수정 ---------- */
document.getElementById('addBtn').addEventListener('click', ()=> openBookForm(null));

function openBookForm(id){
  editingId = id;
  const form = document.getElementById('bookForm');
  form.reset();
  document.getElementById('coverPreview').classList.add('hidden');
  document.getElementById('coverPreview').src = '';

  if(id){
    const book = books.find(b=>b.id === id);
    document.getElementById('bookFormTitle').textContent = '책 정보 수정';
    document.getElementById('bookId').value = book.id;
    document.getElementById('bCategory').value = book.category;
    document.getElementById('bTitle').value = book.title;
    document.getElementById('bAuthor').value = book.author;
    document.getElementById('bSummary').value = book.summary;
    document.getElementById('bReason').value = book.reason;
    if(book.cover){
      const p = document.getElementById('coverPreview');
      p.src = book.cover;
      p.classList.remove('hidden');
    }
  }else{
    document.getElementById('bookFormTitle').textContent = '책 추가하기';
    document.getElementById('bookId').value = '';
  }
  showOverlay('bookOverlay');
}

document.getElementById('bCover').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const p = document.getElementById('coverPreview');
    p.src = reader.result;
    p.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
});

document.getElementById('bookForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const id = document.getElementById('bookId').value;
  const coverPreview = document.getElementById('coverPreview');
  const data = {
    category: document.getElementById('bCategory').value.trim(),
    cover: coverPreview.classList.contains('hidden') ? '' : coverPreview.src,
    title: document.getElementById('bTitle').value.trim(),
    author: document.getElementById('bAuthor').value.trim(),
    summary: document.getElementById('bSummary').value.trim(),
    reason: document.getElementById('bReason').value.trim(),
  };

  if(id){
    const idx = books.findIndex(b=>b.id === id);
    books[idx] = { ...books[idx], ...data };
  }else{
    books.unshift({ id: 'b' + Date.now(), ...data });
  }
  saveBooks();
  hideOverlay('bookOverlay');
  render();
});

function deleteBook(id){
  const book = books.find(b=>b.id === id);
  if(!book) return;
  if(!confirm(`"${book.title}" 책을 삭제할까요?`)) return;
  books = books.filter(b=>b.id !== id);
  saveBooks();
  render();
}

/* ---------- 백업 내보내기 / 불러오기 ---------- */
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(books, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'reading-king-books.json';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data)) throw new Error('형식 오류');
      if(!confirm('불러온 파일로 현재 책 목록을 덮어쓸까요?')) return;
      books = data;
      saveBooks();
      render();
    }catch(err){
      alert('파일을 읽을 수 없어요. 이 앱에서 내보낸 JSON 파일인지 확인해주세요.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

render();
</script>
</body>
</html>
