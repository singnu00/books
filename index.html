<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 반 책장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7EF;
    --card:#FFFEFA;
    --ink:#55493C;
    --ink-soft:#A0937E;
    --ink-faint:#CBBFA9;
    --line:#EFE7D6;
    --accent:#C9B79C;
    --accent-dark:#A9926F;
    --cover-bg:#F2EADA;
    --danger:#B0725E;
    --success:#7A8B6F;
    --serif:'Noto Serif KR', serif;
    --sans:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .hero{max-width:900px;margin:0 auto;padding:34px 24px 10px;position:relative;}
  #authArea{position:absolute;top:34px;right:24px;display:flex;align-items:center;gap:8px;}
  .auth-link{
    background:transparent;border:1px solid var(--line);color:var(--ink-soft);
    padding:8px 15px;border-radius:999px;font-size:0.82rem;
    display:flex;align-items:center;gap:6px;text-decoration:none;cursor:pointer;
  }
  .auth-link:hover{border-color:var(--accent);color:var(--accent-dark);}
  .profile-chip{display:flex;align-items:center;gap:8px;}
  .profile-avatar{
    width:32px;height:32px;border-radius:50%;background:var(--cover-bg);color:var(--accent-dark);
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:0.85rem;
    flex-shrink:0;border:1px solid var(--line);overflow:hidden;
  }
  .profile-text{font-size:0.8rem;color:var(--ink-soft);line-height:1.3;}
  .profile-text b{color:var(--ink);font-weight:600;}
  .profile-logout{background:none;border:none;color:var(--ink-faint);font-size:0.74rem;text-decoration:underline;padding:0;}
  .profile-logout:hover{color:var(--ink-soft);}

  .shelf-illust{display:block;margin:36px auto 22px;width:100%;max-width:560px;}
  .hero h1{font-family:var(--serif);font-weight:500;text-align:center;font-size:clamp(1.9rem,3vw + 1.2rem,2.6rem);margin:0 0 10px;}
  .hero .sub{text-align:center;font-size:0.95rem;color:var(--ink-faint);margin:0 0 6px;}

  main{max-width:640px;margin:0 auto;padding:20px 24px 100px;text-align:center;}
  .cta{
    display:inline-block;margin-top:22px;padding:15px 34px;border-radius:999px;border:none;
    background:var(--accent-dark);color:#fff;font-size:1rem;text-decoration:none;
  }
  .cta:hover{background:var(--ink);}
  .desc{margin-top:34px;padding-top:28px;border-top:1px solid var(--line);color:var(--ink-soft);font-size:0.88rem;}

  @media (max-width:480px){
    #authArea{position:static;justify-content:center;margin:14px auto 0;}
  }
</style>
</head>
<body>

<div class="hero">
  <div id="authArea"></div>
  <svg class="shelf-illust" viewBox="0 0 560 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="책이 꽂힌 책장 일러스트">
    <rect x="30" y="128" width="500" height="10" fill="#B9A386"/>
    <g>
      <rect x="45" y="55" width="26" height="75" fill="#F1E9D8"/>
      <rect x="45" y="55" width="26" height="8" fill="#E3D5BE"/>
      <rect x="75" y="40" width="20" height="90" fill="#C9B79C"/>
      <rect x="75" y="40" width="20" height="8" fill="#A9926F"/>
      <rect x="99" y="62" width="30" height="68" fill="#D9CBB3"/>
      <rect x="133" y="35" width="18" height="95" fill="#8C7A66"/>
      <rect x="133" y="35" width="18" height="8" fill="#6E5D45"/>
      <rect x="155" y="50" width="24" height="80" fill="#EADFC9"/>
      <path d="M172 50 h7 v34 l-3.5 -5 -3.5 5 z" fill="#B9A386"/>
      <rect x="183" y="65" width="20" height="65" fill="#A9926F"/>
      <rect x="207" y="45" width="16" height="85" fill="#E3D5BE"/>
      <rect x="227" y="58" width="26" height="72" fill="#9C8567"/>
      <rect x="227" y="58" width="26" height="7" fill="#7C6A52"/>
      <rect x="257" y="38" width="22" height="92" fill="#F1E9D8"/>
      <rect x="283" y="66" width="28" height="64" fill="#C9B79C"/>
      <rect x="315" y="48" width="18" height="82" fill="#8C7A66"/>
      <rect x="337" y="60" width="24" height="70" fill="#D9CBB3"/>
      <rect x="365" y="42" width="20" height="88" fill="#B5A688"/>
      <rect x="365" y="42" width="20" height="8" fill="#8C7A66"/>
      <rect x="389" y="64" width="26" height="66" fill="#EADFC9"/>
      <rect x="419" y="52" width="18" height="78" fill="#C9B79C"/>
      <rect x="441" y="70" width="30" height="60" fill="#A9926F"/>
      <g transform="rotate(4 495 115)">
        <rect x="475" y="102" width="42" height="14" fill="#D9CBB3"/>
        <rect x="475" y="116" width="42" height="12" fill="#B9A386"/>
      </g>
    </g>
  </svg>
  <h1>우리 반 책장</h1>
  <p class="sub">고1, 책 읽는 걸 좋아하는 친구가 골라 소개하는 책들</p>
</div>

<main>
  <a href="books.html" class="cta">책장 둘러보기 →</a>
  <p class="desc">친구들이 읽고 소개하는 책을 모아두는 공간이에요.<br>로그인하면 마음에 드는 책을 책갈피에 담아둘 수 있어요.</p>
</main>

<script src="common.js"></script>
<script>
  function initial(name){ return (name || '').trim().slice(0,1) || '?'; }

  function renderAuth(){
    const area = document.getElementById('authArea');
    const isAdmin = localStorage.getItem(LS_LOGGED_IN) === 'true';
    const member = getCurrentMemberFull();

    if(isAdmin){
      area.innerHTML = `
        <div class="profile-chip">
          <div class="profile-avatar">관</div>
          <div class="profile-text"><b>관리자</b><br><button class="profile-logout" id="logoutBtn">로그아웃</button></div>
        </div>`;
      document.getElementById('logoutBtn').addEventListener('click', ()=>{
        localStorage.setItem(LS_LOGGED_IN, 'false');
        renderAuth();
      });
      return;
    }

    if(member){
      const roleLabel = member.role === 'teacher' ? '선생님' : '학생';
      area.innerHTML = `
        <div class="profile-chip">
          <div class="profile-avatar">${member.photo ? `<img src="${member.photo}" alt="">` : initial(member.nickname || member.name)}</div>
          <div class="profile-text"><b>${member.nickname || member.name}</b> · ${roleLabel}<br><button class="profile-logout" id="logoutBtn">로그아웃</button></div>
        </div>`;
      document.getElementById('logoutBtn').addEventListener('click', ()=>{
        clearCurrentMember();
        renderAuth();
      });
      return;
    }

    area.innerHTML = `<a href="login.html" class="auth-link">로그인</a>`;
  }

  renderAuth();
</script>
</body>
</html>
