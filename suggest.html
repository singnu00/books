<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>건의사항 | 우리 반 책장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7EF; --card:#FFFEFA; --ink:#55493C; --ink-soft:#A0937E; --ink-faint:#CBBFA9;
    --line:#EFE7D6; --accent:#C9B79C; --accent-dark:#A9926F; --cover-bg:#F2EADA;
    --danger:#B0725E; --success:#7A8B6F;
    --serif:'Noto Serif KR', serif;
    --sans:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .hero{max-width:720px;margin:0 auto;padding:28px 20px 0;}
  .home-link{font-size:0.82rem;color:var(--ink-faint);text-decoration:none;}
  .home-link:hover{color:var(--ink-soft);}
  .hero h1{font-family:var(--serif);font-weight:500;font-size:1.5rem;margin:12px 0 4px;}
  .hero .lead{font-size:0.86rem;color:var(--ink-faint);margin:0 0 6px;}

  main{max-width:720px;margin:0 auto;padding:14px 20px 100px;}
  section.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 20px;margin-bottom:18px;}
  section.card h2{font-family:var(--serif);font-weight:500;font-size:1.05rem;margin:0 0 4px;}
  section.card .sub{font-size:0.82rem;color:var(--ink-faint);margin:0 0 16px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:0.8rem;color:var(--ink-soft);margin-bottom:6px;}
  .field input[type=text],.field select,.field textarea{
    width:100%;border:1px solid var(--line);background:#fff;padding:10px 11px;
    font-family:inherit;font-size:0.94rem;border-radius:2px;color:var(--ink);
  }
  .field textarea{min-height:130px;resize:vertical;}
  .success{font-size:0.8rem;color:var(--success);margin:8px 0 0;display:none;}

  .btn-primary{
    padding:10px 22px;border-radius:999px;border:1px solid var(--line);
    background:var(--line);color:var(--ink-faint);font-size:0.88rem;cursor:not-allowed;
  }
  .btn-primary.is-ready{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;cursor:pointer;}
  .btn-primary.is-ready:hover{background:var(--ink);border-color:var(--ink);}
  .btn-ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:0.78rem;color:var(--ink-soft);}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent-dark);}
  .btn-danger{color:var(--danger);}

  .item{border-top:1px solid var(--line);padding:14px 2px;}
  .item:first-child{border-top:none;}
  .item-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
  .badge{display:inline-block;font-size:0.7rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--cover-bg);color:var(--accent-dark);}
  .badge.done{background:#E6EDE0;color:var(--success);}
  .item-title{font-weight:600;font-size:0.96rem;margin:0;}
  .item-body{font-size:0.88rem;margin:6px 0 8px;white-space:pre-wrap;}
  .item-meta{font-size:0.78rem;color:var(--ink-faint);}
  .realname-tag{color:var(--ink-faint);margin-left:4px;}
  .item-actions{display:flex;gap:6px;margin-top:8px;}
  .empty-note{color:var(--ink-faint);font-size:0.86rem;text-align:center;padding:22px 0;}
</style>
</head>
<body>

<div class="hero">
  <a href="books.html" class="home-link">← 책장으로</a>
  <h1>💌 건의사항</h1>
  <p class="lead">사이트에서 문제를 발견했거나, 바라는 점이 있으면 남겨주세요.</p>
</div>

<main>
  <section class="card">
    <h2>새로 남기기</h2>
    <p class="sub">세 칸을 모두 채워야 보낼 수 있어요.</p>
    <form id="suggestForm">
      <div class="field">
        <label for="sType">종류</label>
        <select id="sType" required>
          <option value="">선택해주세요</option>
        </select>
      </div>
      <div class="field">
        <label for="sTitle">제목</label>
        <input type="text" id="sTitle" maxlength="60" required>
      </div>
      <div class="field">
        <label for="sBody">내용</label>
        <textarea id="sBody" required placeholder="어떤 문제였는지, 어떻게 바뀌면 좋을지 자유롭게 적어주세요."></textarea>
      </div>
      <button type="submit" class="btn-primary" id="sSubmitBtn">보내기</button>
      <p class="success" id="sSuccess">보냈어요. 고마워요!</p>
    </form>
  </section>

  <section class="card">
    <h2 id="listTitle">내가 보낸 건의사항</h2>
    <p class="sub" id="listSub"></p>
    <div id="suggestList"></div>
  </section>
</main>

<script src="common.js"></script>
<script>applyTheme(); applyFont();</script>
<script>
const authState = requireLogin();

window.addEventListener('pageshow', (e)=>{
  if(e.persisted) location.reload();
});

function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str == null ? '' : str; return d.innerHTML; }

// 관리자 화면에서는 닉네임 옆에 회색으로 본명을 같이 보여줘요.
function actorDisplayHtml(key){
  const nickname = escapeHtml(resolveActorName(key));
  if(authState && authState.isAdmin && key && key !== 'admin'){
    const m = resolveActorMember(key);
    if(m) return `${nickname}<span class="realname-tag">(${escapeHtml(m.name)})</span>`;
  }
  return nickname;
}

if(authState){
  const isAdmin = authState.isAdmin;
  const myKey = actorKeyFromAuth(authState);

  const typeSelect = document.getElementById('sType');
  SUGGESTION_TYPES.forEach(t=>{
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    typeSelect.appendChild(opt);
  });

  if(isAdmin){
    document.getElementById('listTitle').textContent = '받은 건의사항';
  }

  const submitBtn = document.getElementById('sSubmitBtn');
  const updateReady = wireReadyButton(
    submitBtn,
    ()=> typeSelect.value && document.getElementById('sTitle').value.trim() && document.getElementById('sBody').value.trim(),
    [typeSelect, document.getElementById('sTitle'), document.getElementById('sBody')]
  );

  document.getElementById('suggestForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const type = typeSelect.value;
    const title = document.getElementById('sTitle').value.trim();
    const body = document.getElementById('sBody').value.trim();
    if(!type || !title || !body) return;
    createSuggestion({ type, title, body, authorKey: myKey });
    document.getElementById('suggestForm').reset();
    updateReady();
    const ok = document.getElementById('sSuccess');
    ok.style.display = 'block';
    setTimeout(()=> ok.style.display = 'none', 2200);
    renderList();
  });

  function renderList(){
    const all = loadSuggestions();
    const list = isAdmin ? all : all.filter(s => s.authorKey === myKey);
    const wrap = document.getElementById('suggestList');

    document.getElementById('listSub').textContent = isAdmin
      ? `전체 ${all.length}개 · 아직 확인 안 한 것 ${all.filter(s => !s.done).length}개`
      : `${list.length}개 · 내가 보낸 것만 보여요. 관리자가 확인하면 "확인함"으로 바뀌어요.`;

    if(list.length === 0){
      wrap.innerHTML = `<p class="empty-note">${isAdmin ? '아직 받은 건의사항이 없어요.' : '아직 보낸 건의사항이 없어요.'}</p>`;
      return;
    }

    wrap.innerHTML = list.map(s => `
      <div class="item" data-id="${s.id}">
        <div class="item-top">
          <span class="badge">${escapeHtml(s.type)}</span>
          <span class="badge ${s.done ? 'done' : ''}">${s.done ? '확인함' : '접수됨'}</span>
        </div>
        <p class="item-title">${escapeHtml(s.title)}</p>
        <p class="item-body">${escapeHtml(s.body)}</p>
        <div class="item-meta">${isAdmin ? actorDisplayHtml(s.authorKey) + ' · ' : ''}${new Date(s.createdAt).toLocaleDateString('ko-KR')}</div>
        <div class="item-actions">
          ${isAdmin ? `<button type="button" class="btn-ghost" data-toggle="${s.id}">${s.done ? '확인 취소' : '확인했어요'}</button>` : ''}
          ${(isAdmin || s.authorKey === myKey) ? `<button type="button" class="btn-ghost btn-danger" data-del="${s.id}">삭제</button>` : ''}
        </div>
      </div>
    `).join('');

    wrap.querySelectorAll('[data-toggle]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const item = loadSuggestions().find(s => s.id === btn.dataset.toggle);
        if(!item) return;
        setSuggestionDone(item.id, !item.done);
        renderList();
      });
    });
    wrap.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(!confirm('이 건의사항을 삭제할까요? 되돌릴 수 없어요.')) return;
        deleteSuggestion(btn.dataset.del);
        renderList();
      });
    });
  }

  renderList();
}
</script>
</body>
</html>
