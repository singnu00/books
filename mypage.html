<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마이페이지 | 우리 반 책장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7EF; --card:#FFFEFA; --ink:#55493C; --ink-soft:#A0937E; --ink-faint:#CBBFA9;
    --line:#EFE7D6; --accent:#C9B79C; --accent-dark:#A9926F; --cover-bg:#F2EADA;
    --danger:#B0725E; --success:#7A8B6F;
    --serif:'Noto Serif KR', serif;
    --sans:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .hero{max-width:640px;margin:0 auto;padding:30px 24px 4px;position:relative;}
  .home-link{font-size:0.82rem;color:var(--ink-faint);text-decoration:none;}
  .home-link:hover{color:var(--ink-soft);}
  .hero h1{font-family:var(--serif);font-weight:500;font-size:1.6rem;margin:14px 0 0;}

  main{max-width:640px;margin:0 auto;padding:10px 24px 100px;}
  section.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:24px 22px;margin-top:20px;}
  section.card h2{font-family:var(--serif);font-weight:500;font-size:1.1rem;margin:0 0 4px;}
  section.card .sub{font-size:0.82rem;color:var(--ink-faint);margin:0 0 18px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:0.8rem;color:var(--ink-soft);margin-bottom:6px;}
  .field input[type=text],.field input[type=password]{
    width:100%;border:1px solid var(--line);background:#fff;padding:10px 11px;
    font-family:inherit;font-size:0.94rem;border-radius:2px;color:var(--ink);
  }
  .field input[disabled]{background:var(--bg);color:var(--ink-soft);}
  .helper{font-size:0.78rem;color:var(--ink-soft);margin:4px 0 0;}
  .error{font-size:0.8rem;color:var(--danger);margin:-4px 0 12px;display:none;}
  .success{font-size:0.8rem;color:var(--success);margin:-4px 0 12px;display:none;}

  .profile-row{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
  .avatar-big{
    width:64px;height:64px;border-radius:50%;background:var(--cover-bg);color:var(--accent-dark);
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.4rem;
    border:1px solid var(--line);overflow:hidden;flex-shrink:0;
  }
  .avatar-big img{width:100%;height:100%;object-fit:cover;}
  .avatar-actions{font-size:0.8rem;}
  .avatar-actions label{color:var(--accent-dark);text-decoration:underline;cursor:pointer;}

  .btn-primary{
    padding:10px 20px;border-radius:999px;border:1px solid var(--line);
    background:var(--line);color:var(--ink-faint);font-size:0.88rem;cursor:not-allowed;
  }
  .btn-primary.is-ready{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;cursor:pointer;}
  .btn-primary.is-ready:hover{background:var(--ink);border-color:var(--ink);}

  .pw-line{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:0.9rem;}
  .pw-line .dots{letter-spacing:3px;color:var(--ink-soft);}
  .divider-dashed{border-top:1px dashed var(--line);margin:14px 0;}

  .liked-item, .comment-item{
    display:block;width:100%;text-align:left;background:none;border:none;padding:12px 0;
    border-top:1px solid var(--line);font-family:inherit;
  }
  .liked-item:first-child, .comment-item:first-child{border-top:none;}
  .liked-item .cat{font-size:0.7rem;color:var(--accent-dark);margin:0 0 3px;}
  .liked-item .title{font-size:0.95rem;font-weight:600;margin:0;}
  .liked-item .author{font-size:0.8rem;color:var(--ink-faint);margin:2px 0 0;}
  .comment-item .ctx{font-size:0.82rem;color:var(--ink-faint);margin:0 0 4px;}
  .comment-item .mine{font-size:0.9rem;margin:0;}
  .comment-item .mine b{color:var(--accent-dark);}
  .empty-note{color:var(--ink-faint);font-size:0.86rem;text-align:center;padding:20px 0;}
</style>
</head>
<body>

<div class="hero">
  <a href="books.html" class="home-link">← 책장으로</a>
  <h1>마이페이지</h1>
</div>

<main id="pageBody">
  <!-- JS로 내용을 채워요 -->
</main>

<script src="common.js"></script>
<script>
const authState = requireLogin();

if(!authState || authState.isAdmin || !authState.member){
  document.getElementById('pageBody').innerHTML = `
    <section class="card">
      <h2>마이페이지는 학생·선생님 계정 전용이에요</h2>
      <p class="sub">관리자 모드에서는 책장 화면의 "멤버" 메뉴를 이용해주세요.</p>
      <a class="home-link" href="books.html">← 책장으로 돌아가기</a>
    </section>`;
} else {
  initPage();
}

function initial(str){ return (str || '').trim().slice(0,1) || '?'; }
function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

function getMyMember(){
  return getCurrentMemberFull();
}

function initPage(){
  const body = document.getElementById('pageBody');
  body.innerHTML = `
    <section class="card" id="profileCard">
      <h2>프로필</h2>
      <p class="sub">게시판에서 보여질 사진과 아이디예요. 실제 이름은 관리자만 확인할 수 있어요.</p>
      <div class="profile-row">
        <div class="avatar-big" id="avatarPreview"></div>
        <div class="avatar-actions">
          <label for="photoInput">사진 바꾸기</label>
          <input type="file" id="photoInput" accept="image/*" style="display:none;">
        </div>
      </div>
      <div class="field">
        <label for="nicknameInput">아이디 (게시판 닉네임)</label>
        <input type="text" id="nicknameInput" maxlength="12">
        <p class="helper">기본값은 로그인할 때 쓴 이름이에요. 원하는 아이디로 바꿀 수 있어요.</p>
      </div>
      <p class="success" id="profileSuccess">저장했어요.</p>
      <button type="button" class="btn-primary" id="profileSaveBtn">저장하기</button>
    </section>

    <section class="card" id="likedCard">
      <h2>좋아요 누른 글</h2>
      <p class="sub">하트를 누른 책 소개 글이에요. 클릭하면 글로 이동해요.</p>
      <div id="likedList"></div>
    </section>

    <section class="card" id="accountCard">
      <h2>내 계정</h2>
      <p class="sub">로그인 정보예요.</p>
      <div class="pw-line"><span>학번</span><b id="acctId">-</b></div>
      <div class="pw-line"><span>이름</span><b id="acctName">-</b></div>
      <div class="pw-line"><span>비밀번호</span><span class="dots">••••</span></div>
      <div class="divider-dashed"></div>
      <div class="field"><label for="curPw">현재 비밀번호</label><input type="password" id="curPw"></div>
      <div class="field"><label for="newPw">바꿀 비밀번호</label><input type="password" id="newPw"></div>
      <div class="field"><label for="confirmPw">바꿀 비밀번호 확인</label><input type="password" id="confirmPw"></div>
      <p class="error" id="pwError"></p>
      <p class="success" id="pwSuccess">비밀번호를 바꿨어요.</p>
      <button type="button" class="btn-primary" id="pwChangeBtn">비밀번호 바꾸기</button>
    </section>

    <section class="card" id="commentsCard">
      <h2>내가 쓴 댓글</h2>
      <p class="sub">클릭하면 해당 게시글로 이동해요.</p>
      <div id="commentsList"></div>
    </section>
  `;

  renderProfile();
  renderLiked();
  renderAccount();
  renderMyComments();
  wirePasswordForm();
}

/* ---------- 프로필 ---------- */
function renderProfile(){
  const m = getMyMember();
  const preview = document.getElementById('avatarPreview');
  preview.innerHTML = m.photo ? `<img src="${m.photo}" alt="">` : initial(m.nickname || m.name);
  document.getElementById('nicknameInput').value = m.nickname || m.name;

  let pendingPhoto = m.photo || '';

  document.getElementById('photoInput').addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      pendingPhoto = reader.result;
      preview.innerHTML = `<img src="${pendingPhoto}" alt="">`;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('profileSaveBtn').addEventListener('click', ()=>{
    const nickname = document.getElementById('nicknameInput').value.trim() || m.name;
    const members = loadMembers();
    const idx = members.findIndex(mm => mm.role === m.role && mm.name === m.name && (m.role === 'teacher' || mm.id === m.id));
    if(idx === -1) return;
    members[idx].nickname = nickname;
    members[idx].photo = pendingPhoto;
    saveMembers(members);
    const successEl = document.getElementById('profileSuccess');
    successEl.style.display = 'block';
    setTimeout(()=> successEl.style.display = 'none', 1800);
  });
}

/* ---------- 좋아요 누른 글 ---------- */
function renderLiked(){
  const m = getMyMember();
  const key = actorKeyFromMember(m);
  const posts = loadPosts().filter(p => p.likes.includes(key));
  const wrap = document.getElementById('likedList');
  if(posts.length === 0){
    wrap.innerHTML = '<p class="empty-note">아직 좋아요를 누른 글이 없어요.</p>';
    return;
  }
  wrap.innerHTML = posts.map(p => `
    <button type="button" class="liked-item" data-post="${p.id}">
      <p class="cat">${escapeHtml(p.categoryCode)} ${escapeHtml(p.categoryLabel)}</p>
      <p class="title">${escapeHtml(p.title)}</p>
      <p class="author">${escapeHtml(p.author)} 지음 · ✍️ ${escapeHtml(resolveActorName(p.authorKey))}</p>
    </button>
  `).join('');
  wrap.querySelectorAll('[data-post]').forEach(el=>{
    el.addEventListener('click', ()=> location.href = 'books.html?post=' + el.dataset.post);
  });
}

/* ---------- 내 계정 ---------- */
function renderAccount(){
  const m = getMyMember();
  document.getElementById('acctId').textContent = m.role === 'teacher' ? '(선생님)' : m.id;
  document.getElementById('acctName').textContent = m.name;
}

function wirePasswordForm(){
  const btn = document.getElementById('pwChangeBtn');
  const update = wireReadyButton(
    btn,
    ()=> document.getElementById('curPw').value && document.getElementById('newPw').value && document.getElementById('confirmPw').value,
    [document.getElementById('curPw'), document.getElementById('newPw'), document.getElementById('confirmPw')]
  );
  btn.addEventListener('click', ()=>{
    const err = document.getElementById('pwError');
    const ok = document.getElementById('pwSuccess');
    err.style.display = 'none'; ok.style.display = 'none';
    const m = getMyMember();
    const cur = document.getElementById('curPw').value;
    const nw = document.getElementById('newPw').value;
    const cf = document.getElementById('confirmPw').value;
    const storedPw = m.password || localStorage.getItem(LS_STUDENT_PW);
    if(cur !== storedPw){ err.textContent = '현재 비밀번호가 일치하지 않아요.'; err.style.display = 'block'; return; }
    if(nw !== cf){ err.textContent = '바꿀 비밀번호가 서로 달라요.'; err.style.display = 'block'; return; }
    if(nw.length < 1){ err.textContent = '새 비밀번호를 입력해주세요.'; err.style.display = 'block'; return; }
    const members = loadMembers();
    const idx = members.findIndex(mm => mm.role === m.role && mm.name === m.name && (m.role === 'teacher' || mm.id === m.id));
    if(idx === -1) return;
    members[idx].password = nw;
    saveMembers(members);
    ok.style.display = 'block';
    document.getElementById('curPw').value = '';
    document.getElementById('newPw').value = '';
    document.getElementById('confirmPw').value = '';
    update();
  });
}

/* ---------- 내가 쓴 댓글 ---------- */
function renderMyComments(){
  const m = getMyMember();
  const key = actorKeyFromMember(m);
  const posts = loadPosts();
  const mine = [];
  posts.forEach(p=>{
    p.comments.filter(c => c.authorKey === key).forEach(c=>{
      mine.push({ post: p, comment: c });
    });
  });
  mine.sort((a,b)=> b.comment.createdAt - a.comment.createdAt);

  const wrap = document.getElementById('commentsList');
  if(mine.length === 0){
    wrap.innerHTML = '<p class="empty-note">아직 남긴 댓글이 없어요.</p>';
    return;
  }
  wrap.innerHTML = mine.map(({post, comment}) => `
    <button type="button" class="comment-item" data-post="${post.id}">
      <p class="ctx">${escapeHtml(post.title)} - ${escapeHtml(resolveActorName(post.authorKey))}</p>
      <p class="mine"><b>나</b> : ${escapeHtml(comment.text)}</p>
    </button>
  `).join('');
  wrap.querySelectorAll('[data-post]').forEach(el=>{
    el.addEventListener('click', ()=> location.href = 'books.html?post=' + el.dataset.post);
  });
}
</script>
</body>
</html>
